<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Football</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="env.js"></script>
<script src="chat.js"></script>
<style>
:root {
  --text-primary: #FAFAFA; --text-secondary: #B8B6B0; --text-tertiary: #76746E;
  --success: #6BE3A4; --warning: #F2C063; --danger: #FF6B6B; --info: #7DD3FC;
  --mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;
  background:#050506;color:var(--text-primary);min-height:100vh;min-height:100dvh;
  max-width:700px;margin:0 auto;padding:12px 16px max(32px,env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}

/* ── Section ── */
.section{margin-bottom:24px}
.section-title{
  font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--text-tertiary);margin-bottom:12px;display:flex;align-items:center;gap:10px;
}
.section-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.08),transparent)}

/* ── Card ── */
.card{
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);
  border-radius:14px;padding:16px;margin-bottom:12px;
  backdrop-filter:blur(24px) saturate(1.2);-webkit-backdrop-filter:blur(24px) saturate(1.2);
}

/* ── Segmented Buttons ── */
.seg-row{display:flex;gap:4px;flex-wrap:wrap}
.seg-btn{
  padding:7px 12px;border:1px solid rgba(255,255,255,.08);
  background:rgba(0,0,0,.20);color:var(--text-tertiary);border-radius:7px;
  font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;
}
.seg-btn.active{background:rgba(107,227,164,.12);color:var(--success);border-color:rgba(107,227,164,.30)}

/* ── Focus Area Tags ── */
.focus-tags{display:flex;flex-wrap:wrap;gap:6px}
.focus-tag{
  padding:5px 10px;border-radius:99px;font-size:10px;font-weight:700;cursor:pointer;
  border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.04);color:var(--text-tertiary);
  letter-spacing:.03em;transition:all .15s;font-family:var(--mono);
}
.focus-tag.selected{background:rgba(107,227,164,.14);color:var(--success);border-color:rgba(107,227,164,.35)}
.focus-tag.high-priority{border-color:rgba(255,107,107,.30);color:var(--danger)}

/* ── Form ── */
.form-group{margin-bottom:14px}
.form-label{
  display:block;font-size:10px;font-weight:700;letter-spacing:.10em;
  text-transform:uppercase;color:var(--text-tertiary);margin-bottom:6px;
}
.form-input{
  width:100%;padding:10px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.08);
  background:rgba(0,0,0,.30);color:var(--text-primary);font-size:14px;font-family:inherit;outline:none;
}
.form-input:focus{border-color:rgba(107,227,164,.4)}
textarea.form-input{min-height:80px;resize:vertical}

/* ── Buttons ── */
.btn-primary{
  width:100%;padding:13px;border:none;border-radius:10px;
  background:linear-gradient(180deg,#FFFFFF 0%,#E8E5DD 100%);color:#0A0A0B;
  font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;
  box-shadow:0 2px 8px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.8);
  transition:transform .15s,filter .15s;
}
.btn-primary:hover{transform:translateY(-1px);filter:brightness(1.05)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* ── Session Card ── */
.session-card{
  background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.05);
  border-radius:12px;padding:14px;margin-bottom:6px;display:flex;gap:12px;align-items:flex-start;
}
.session-icon{
  width:36px;height:36px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-size:18px;flex-shrink:0;background:rgba(255,255,255,.06);
}
.session-info{flex:1;min-width:0}
.session-title{font-size:14px;font-weight:700;margin-bottom:2px}
.session-meta{font-size:11px;color:var(--text-tertiary);display:flex;flex-wrap:wrap;gap:8px}
.session-focus{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.session-focus-tag{
  font-size:9px;font-weight:700;padding:2px 7px;border-radius:99px;
  font-family:var(--mono);letter-spacing:.04em;background:rgba(107,227,164,.10);color:var(--success);
}
.session-delete{
  background:none;border:none;color:var(--text-tertiary);font-size:18px;cursor:pointer;
  padding:4px 8px;border-radius:6px;transition:all .15s;
}
.session-delete:hover{color:var(--danger);background:rgba(255,107,107,.10)}

/* ── Quality Stars ── */
.quality-stars{display:flex;gap:4px}
.quality-star{
  width:28px;height:28px;border-radius:6px;border:1px solid rgba(255,255,255,.12);
  background:rgba(0,0,0,.20);color:var(--text-tertiary);font-size:14px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;
  transition:all .15s;font-family:var(--mono);
}
.quality-star.filled{background:rgba(107,227,164,.20);color:var(--success);border-color:var(--success)}

/* ── Radar Chart ── */
.radar-wrap{display:flex;justify-content:center;margin:16px 0}
.radar-svg{width:100%;max-width:280px;height:280px}

/* ── Priority Weakness ── */
.priority-weakness{
  background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.20);
  border-radius:10px;padding:12px 14px;margin-top:12px;
}
.priority-label{color:var(--danger);font-weight:700;font-size:11px;margin-bottom:6px;letter-spacing:.06em;text-transform:uppercase}
.priority-text{font-size:13px;color:var(--text-secondary);line-height:1.6}

/* ── Drill Library ── */
.drill-card{
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);
  border-radius:10px;padding:12px;margin-bottom:8px;
}
.drill-name{font-size:13px;font-weight:700;margin-bottom:4px;color:var(--success)}
.drill-meta{font-size:11px;color:var(--text-tertiary);display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px}
.drill-desc{font-size:11px;color:var(--text-secondary);line-height:1.5}
.drill-decision{font-size:11px;color:var(--warning);margin-top:4px;font-style:italic}

/* ── Match Performance Card ── */
.match-card{
  background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.05);
  border-radius:12px;padding:14px;margin-bottom:8px;
}
.match-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.match-result{font-size:13px;font-weight:700}
.match-result.win{color:var(--success)}.match-result.loss{color:var(--danger)}.match-result.draw{color:var(--warning)}
.match-meta{font-size:11px;color:var(--text-tertiary)}
.rating-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.rating-item{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:rgba(0,0,0,.15);border-radius:6px}
.rating-label{font-size:11px;color:var(--text-secondary)}
.rating-value{font-size:14px;font-weight:700;font-family:var(--mono)}
.rating-value.high{color:var(--success)}.rating-value.mid{color:var(--warning)}.rating-value.low{color:var(--danger)}
.ai-note{
  margin-top:10px;padding:10px;border-radius:8px;font-size:11px;line-height:1.5;
  background:rgba(107,227,164,.06);border:1px solid rgba(107,227,164,.15);color:var(--text-secondary);
}

/* ── Trend Chart ── */
.trend-wrap{margin-top:12px}
.trend-svg{display:block;width:100%;height:40px;overflow:visible}
.trend-label{font-size:9px;color:var(--text-tertiary);text-align:center;margin-top:2px;font-family:var(--mono)}

/* ── Modal ── */
.modal-bg{display:none;position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
body:has(.modal-bg.show){overflow:hidden}
.modal{background:#0e0e10;border:1px solid rgba(255,255,255,.07);border-radius:16px 16px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:600px;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-title{font-size:17px;font-weight:700}
.modal-close{background:rgba(255,255,255,.07);border:none;color:var(--text-secondary);font-size:18px;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer}

/* ── Cross-Reference Alert ── */
.cross-ref{
  background:rgba(125,211,252,.08);border:1px solid rgba(125,211,252,.20);
  border-radius:10px;padding:12px;margin-top:12px;font-size:12px;color:var(--info);line-height:1.5;
}

/* ── Toast ── */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#0e0e10;border:1px solid rgba(255,255,255,.10);padding:10px 20px;border-radius:12px;font-size:13px;font-weight:600;z-index:9999;pointer-events:none;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}

/* ── Empty State ── */
.empty-state{text-align:center;padding:24px;color:var(--text-tertiary);font-size:13px;font-style:italic}

@media(max-width:480px){
  .rating-grid{grid-template-columns:1fr}
  .radar-svg{max-width:240px;height:240px}
}
</style>
</head>
<body>

<h1 style="font-size:26px;font-weight:700;letter-spacing:-.025em;margin-bottom:20px;background:linear-gradient(180deg,#FFFFFF 0%,#C7C4BC 120%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent">Football</h1>

<!-- ═══ SECTION 1: TECHNICAL DEVELOPMENT ═══ -->
<div class="section">
  <div class="section-title">Technical Development</div>

  <!-- Weakness Analysis -->
  <div class="card" id="weaknessCard">
    <div style="font-size:13px;font-weight:700;margin-bottom:12px">📊 Technical Time Distribution (30 days)</div>
    <div class="radar-wrap"><svg class="radar-svg" id="radarChart" viewBox="0 0 280 280"></svg></div>
    <div id="priorityWeakness"></div>
  </div>

  <!-- Drill Library -->
  <div class="card" id="drillCard">
    <div style="font-size:13px;font-weight:700;margin-bottom:12px">📚 Solo Drill Library</div>
    <div id="drillList"></div>
  </div>

  <!-- Session List -->
  <div id="techSessionList"></div>
  <div class="empty-state" id="techEmpty">No technical sessions logged yet</div>

  <button class="btn-primary" id="logTechBtn" style="background:rgba(255,255,255,.05);color:var(--text-primary);border:1px dashed rgba(255,255,255,.15);margin-top:4px">+ Log Technical Session</button>
</div>

<!-- ═══ SECTION 2: MATCH PERFORMANCE ═══ -->
<div class="section">
  <div class="section-title">Match Performance</div>

  <!-- Match Trend -->
  <div class="card" id="trendCard" style="display:none">
    <div style="font-size:13px;font-weight:700;margin-bottom:12px">📈 Performance Trends (Last 10 Matches)</div>
    <div id="trendCharts"></div>
    <div id="crossRef"></div>
  </div>

  <!-- Match List -->
  <div id="matchList"></div>
  <div class="empty-state" id="matchEmpty">No matches logged yet</div>

  <button class="btn-primary" id="logMatchBtn" style="background:rgba(255,255,255,.05);color:var(--text-primary);border:1px dashed rgba(255,255,255,.15);margin-top:4px">+ Log Match Performance</button>
</div>

<!-- ═══ TECHNICAL SESSION MODAL ═══ -->
<div class="modal-bg" id="techModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Log Technical Session</div>
      <button class="modal-close" id="techModalClose">×</button>
    </div>
    <div class="form-group"><label class="form-label">Date</label><input type="date" class="form-input" id="techDate"></div>
    <div class="form-group"><label class="form-label">Session Type</label>
      <div class="seg-row" id="techTypeSeg">
        <button class="seg-btn active" data-type="wall_work">🧱 Wall Work</button>
        <button class="seg-btn" data-type="cone_dribbling">🔺 Cone Dribbling & Turning</button>
        <button class="seg-btn" data-type="finishing">🎯 Finishing</button>
        <button class="seg-btn" data-type="long_passing">📡 Long Passing</button>
        <button class="seg-btn" data-type="pressing_patterns">⚡ Pressing Patterns</button>
      </div>
    </div>
    <div class="form-group"><label class="form-label">Duration (minutes)</label><input type="number" class="form-input" id="techDuration" placeholder="e.g. 45" min="5"></div>
    <div class="form-group"><label class="form-label">Intensity</label>
      <div class="seg-row" id="techIntensitySeg">
        <button class="seg-btn" data-value="light">Light</button>
        <button class="seg-btn active" data-value="medium">Medium</button>
        <button class="seg-btn" data-value="high">High</button>
      </div>
    </div>
    <div class="form-group"><label class="form-label">Quality Rating</label>
      <div class="quality-stars" id="techQualityStars"></div>
    </div>
    <div class="form-group"><label class="form-label">Focus Areas (select all that apply)</label>
      <div class="focus-tags" id="techFocusTags"></div>
    </div>
    <div class="form-group"><label class="form-label">Notes (optional)</label><textarea class="form-input" id="techNotes" placeholder="Coaching notes or self-assessment..."></textarea></div>
    <button class="btn-primary" id="techSaveBtn">Save Session</button>
  </div>
</div>

<!-- ═══ MATCH PERFORMANCE MODAL ═══ -->
<div class="modal-bg" id="matchModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Log Match Performance</div>
      <button class="modal-close" id="matchModalClose">×</button>
    </div>
    <div class="form-group"><label class="form-label">Date</label><input type="date" class="form-input" id="matchDate"></div>
    <div class="form-group"><label class="form-label">Competition Type</label>
      <div class="seg-row" id="matchCompSeg">
        <button class="seg-btn active" data-value="rec_league">Rec League</button>
        <button class="seg-btn" data-value="friendly">Friendly</button>
        <button class="seg-btn" data-value="trial">Trial</button>
        <button class="seg-btn" data-value="official">Official</button>
      </div>
    </div>
    <div class="form-group"><label class="form-label">Minutes Played</label><input type="number" class="form-input" id="matchMinutes" placeholder="e.g. 90" min="0" max="120"></div>
    <div class="form-group"><label class="form-label">Position</label><input type="text" class="form-input" id="matchPosition" placeholder="e.g. CM, CDM"></div>
    <div class="form-group"><label class="form-label">Result</label>
      <div class="seg-row" id="matchResultSeg">
        <button class="seg-btn" data-value="win">🏆 Win</button>
        <button class="seg-btn" data-value="loss">Loss</button>
        <button class="seg-btn active" data-value="draw">Draw</button>
      </div>
    </div>
    <div class="form-group"><label class="form-label">Performance Ratings (1–10)</label></div>
    <div id="matchRatings"></div>
    <div class="form-group"><label class="form-label">What to improve (optional)</label><textarea class="form-input" id="matchNotes" placeholder="What went well, what to work on..."></textarea></div>
    <div id="matchAiNote" style="margin-bottom:12px"></div>
    <button class="btn-primary" id="matchSaveBtn">Save & Generate AI Coaching Note</button>
  </div>
</div>

<div class="toast" id="toast"></div>

// ── Toast ──

function segValue(segId){const a=$(segId).querySelector('.seg-btn.active');return a?(a.dataset.type||a.dataset.value):null}

let techQuality=7;
function buildQualityStars(){
  const c=$('techQualityStars');c.innerHTML='';
  for(let i=1;i<=10;i++){
    const s=document.createElement('div');s.className='quality-star'+(i<=techQuality?' filled':'');s.textContent=i;
    s.addEventListener('click',()=>{techQuality=i;buildQualityStars()});
    c.appendChild(s);
  }
}

// ── Focus Tags ──
let selectedFocus=[];function buildFocusTags(){
  const c=$('techFocusTags');c.innerHTML='';
  FOCUS_AREAS.forEach(f=>{
    const t=document.createElement('div');
    t.className='focus-tag'+(selectedFocus.includes(f.id)?' selected':'')+(f.priority==='high'?' high-priority':'');
    t.textContent=f.label+(f.priority==='high'?' ⚠':'');
    t.addEventListener('click',()=>{
      const idx=selectedFocus.indexOf(f.id);
      if(idx>=0)selectedFocus.splice(idx,1);else selectedFocus.push(f.id);
      buildFocusTags();
    });
    c.appendChild(t);
  });
}

// ── Match Ratings ──
function buildMatchRatings(prefill={}){
  const c=$('matchRatings');const ratings=[
    {key:'engine_rating',label:'Engine & Work Rate',hint:'Primary strength — track carefully'},
    {key:'defensive_rating',label:'Defensive Actions',hint:'Tackles, interceptions, pressing'},
    {key:'progressive_rating',label:'Progressive Actions',hint:'Carries, line-breaking passes, switches'},
    {key:'aerial_rating',label:'Aerial Duels',hint:'Heading, physical presence'},
    {key:'press_resistance_rating',label:'Press Resistance',hint:'Keeping ball under pressure — D1 requirement'},
    {key:'decision_speed_rating',label:'Decision Speed',hint:'How quickly you processed & executed'}
  ];
  c.innerHTML=ratings.map(r=>`<div class="form-group" style="margin-bottom:8px">
    <label class="form-label">${r.label} <span style="font-size:9px;font-weight:400;color:var(--text-tertiary)">${r.hint}</span></label>
    <div class="quality-stars" id="stars_${r.key}"></div>
  </div>`).join('');
  // Build star selectors
  ratings.forEach(r=>{
    const sc=document.getElementById('stars_'+r.key);const val=prefill[r.key]||5;
    for(let i=1;i<=10;i++){
      const s=document.createElement('div');s.className='quality-star'+(i<=val?' filled':'');s.textContent=i;
      s.addEventListener('click',()=>{
        document.querySelectorAll('#stars_'+r.key+' .quality-star').forEach((el,j)=>el.classList.toggle('filled',j<i));
      });
      sc.appendChild(s);
    }
  });
}

function getMatchRating(key){const sc=document.getElementById('stars_'+key);return sc?sc.querySelectorAll('.filled').length:5}

// ── DATA LOAD ──
let techSessions=[],matchPerformances=[];

async function loadAll(){
  const thirtyDaysAgo=new Date();thirtyDaysAgo.setDate(thirtyDaysAgo.getDate()-30);
  const thirtyAgoStr=thirtyDaysAgo.toISOString().slice(0,10);
  const[tRes,mRes]=await Promise.all([
    sb.from('technical_sessions').select('*').gte('date',thirtyAgoStr).order('date',{ascending:false}),
    sb.from('match_performances').select('*').order('date',{ascending:false}).limit(10)
  ]);
  techSessions=tRes.data||[];matchPerformances=mRes.data||[];
  renderAll();
}

// ── RENDER ALL ──
function renderAll(){
  renderTechList();renderWeakness();renderDrills();renderMatchList();renderTrends();
}

// ── Weakness Analysis ──
function renderWeakness(){
  const thirtyDaysAgo=new Date();thirtyDaysAgo.setDate(thirtyDaysAgo.getDate()-30);
  const thirtyAgoStr=thirtyDaysAgo.toISOString().slice(0,10);
  const recent=techSessions.filter(s=>s.date>=thirtyAgoStr);

  // Aggregate time per focus area (weight high intensity ×1.5)
  const timeMap={};FOCUS_AREAS.forEach(f=>timeMap[f.id]=0);
  recent.forEach(s=>{
    const areas=s.focus_areas&&typeof s.focus_areas==='object'?s.focus_areas:[];
    const weight=s.intensity==='high'?1.5:1;
    const timePerArea=areas.length?(s.duration_minutes*weight)/areas.length:s.duration_minutes*weight;
    areas.forEach(a=>{if(timeMap[a]!==undefined)timeMap[a]+=timePerArea});
  });

  // Render radar chart
  const labels=FOCUS_AREAS.map(f=>f.id);const values=labels.map(l=>Math.round(timeMap[l]));
  const maxVal=Math.max(...values,1);
  renderRadar(labels,values,maxVal);

  // Find two least practiced
  const sorted=labels.map(l=>({id:l,time:timeMap[l]})).sort((a,b)=>a.time-b.time);
  const weakest=sorted.slice(0,2);
  const scenarioMap={
    weak_foot:'defenders will force you onto it repeatedly — every opponent at D1 level will exploit this within the first 10 minutes of a match',
    first_touch:'heavy touches under a press will result in turnovers in your own half — D1 midfielders are trained to press the first touch',
    receiving_turning:'you will be marked tight and unable to receive facing forward — turning becomes the only way to progress play',
    driven_passing:'switches of play that should relieve pressure will fall short or sail out — transitions break down',
    combination_play:'you will lose possession in tight spaces — D1 teams play through thirds via combinations',
    press_triggers:'opponents will play through your press easily — the trigger timing is the difference between winning possession and being bypassed',
    crossing:'chances created from wide areas will not convert — delivery quality directly correlates to goals from crosses',
    finishing_first_time:'half-chances in the box require first-time finishes — hesitation allows the defender or keeper to recover',
    dribbling_pressure:'you will be unable to beat the first defender 1v1 — D1 fullbacks are trained to delay and contain, requiring clean dribbling exits'
  };

  const w1=FOCUS_MAP[weakest[0]?.id];const w2=FOCUS_MAP[weakest[1]?.id];
  if(w1&&w2){
    $('priorityWeakness').innerHTML=`<div class="priority-weakness">
      <div class="priority-label">⚠ Priority Weaknesses</div>
      <div class="priority-text">
        Your two least-practiced technical areas this month: <strong style="color:var(--danger)">${w1.label}</strong> (${Math.round(weakest[0].time)}min) and <strong style="color:var(--danger)">${w2.label}</strong> (${Math.round(weakest[1].time)}min).<br><br>
        At D1 level, weakness in <strong>${w1.label}</strong> will be exposed: ${scenarioMap[w1.id]||'opponents will target this area.'}<br><br>
        <span style="font-size:11px;color:var(--warning)">💡 Perception-action coupling — technical practice that includes decision-making under pressure — has significantly higher transfer to match performance than isolated repetition. High intensity sessions (⭐ marked) are weighted 1.5× in this analysis.</span>
      </div>
    </div>`;
    writeAppState('weakest_technical_area',w1.label);
    writeAppState('technical_sessions_this_week',recent.filter(s=>s.date>=new Date(Date.now()-7*86400000).toISOString().slice(0,10)).length);
  } else {
    $('priorityWeakness').innerHTML=`<div class="priority-weakness" style="background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.08)">
      <div style="color:var(--text-tertiary);font-size:12px;text-align:center">Log technical sessions to see your time distribution and priority weaknesses</div>
    </div>`;
  }
}

function renderRadar(labels,values,maxVal){
  const svg=$('radarChart');if(!svg)return;
  const cx=140,cy=140,r=110,n=labels.length;
  if(n<3)return;
  let html='';
  // Grid circles
  for(let i=1;i<=3;i++){const rad=r*(i/3);html+=`<circle cx="${cx}" cy="${cy}" r="${rad}" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>`}
  // Axes
  for(let i=0;i<n;i++){
    const ang=(Math.PI*2*i)/n-Math.PI/2;
    const x=cx+r*Math.cos(ang),y=cy+r*Math.sin(ang);
    html+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>`;
  }
  // Data polygon
  const pts=values.map((v,i)=>{
    const ang=(Math.PI*2*i)/n-Math.PI/2;const rad=r*(v/maxVal);
    return`${(cx+rad*Math.cos(ang)).toFixed(1)},${(cy+rad*Math.sin(ang)).toFixed(1)}`;
  });
  html+=`<polygon points="${pts.join(' ')}" fill="rgba(107,227,164,0.15)" stroke="#6BE3A4" stroke-width="2" stroke-linejoin="round"/>`;
  // Dots
  values.forEach((v,i)=>{
    const ang=(Math.PI*2*i)/n-Math.PI/2;const rad=r*(v/maxVal);
    html+=`<circle cx="${(cx+rad*Math.cos(ang)).toFixed(1)}" cy="${(cy+rad*Math.sin(ang)).toFixed(1)}" r="3" fill="#6BE3A4"/>`;
  });
  // Labels
  for(let i=0;i<n;i++){
    const ang=(Math.PI*2*i)/n-Math.PI/2;const lx=cx+(r+24)*Math.cos(ang),ly=cy+(r+18)*Math.sin(ang);
    const short=labels[i].replace(/_/g,' ').split(' ').map(w=>w[0].toUpperCase()+w.slice(1,3)).join('');
    html+=`<text x="${lx.toFixed(0)}" y="${ly.toFixed(0)}" text-anchor="middle" dominant-baseline="middle" fill="var(--text-tertiary)" font-size="8" font-family="var(--mono)" font-weight="600">${short}</text>`;
  }
  svg.innerHTML=html;
}

// ── Match List ──
function renderMatchList(){
  const list=$('matchList'),empty=$('matchEmpty');
  if(!matchPerformances.length){list.innerHTML='';empty.style.display='block';return}
  empty.style.display='none';
  list.innerHTML=matchPerformances.map(m=>{
    const ratings=[
      {k:'engine_rating',l:'Engine',v:m.engine_rating},{k:'defensive_rating',l:'Defensive',v:m.defensive_rating},
      {k:'progressive_rating',l:'Progressive',v:m.progressive_rating},{k:'aerial_rating',l:'Aerial',v:m.aerial_rating},
      {k:'press_resistance_rating',l:'Press Res',v:m.press_resistance_rating},{k:'decision_speed_rating',l:'Decision',v:m.decision_speed_rating}
    ];
    const avgRating=Math.round(ratings.reduce((s,r)=>s+(r.v||0),0)/ratings.length);
    const rCls=avgRating>=7?'high':avgRating>=5?'mid':'low';
    const compLabels={rec_league:'Rec League',friendly:'Friendly',trial:'Trial',official:'Official'};
    return`<div class="match-card">
      <div class="match-header">
        <div>
          <div class="match-result ${m.result||''}">${m.result==='win'?'🏆 Win':m.result==='loss'?'Loss':'🤝 Draw'} · ${compLabels[m.competition_type]||m.competition_type}</div>
          <div class="match-meta">${m.date} · ${m.minutes_played||0}min · ${m.position||'—'}</div>
        </div>
        <div class="rating-value ${rCls}" style="font-size:20px">${avgRating}</div>
      </div>
      <div class="rating-grid">${ratings.map(r=>`<div class="rating-item">
        <span class="rating-label">${r.l}</span><span class="rating-value ${r.v>=7?'high':r.v>=5?'mid':'low'}">${r.v||'—'}</span>
      </div>`).join('')}</div>
      ${m.notes?`<div style="font-size:11px;color:var(--text-secondary);margin-top:8px">${m.notes}</div>`:''}
      ${m.ai_coaching_note?`<div class="ai-note">🤖 <strong>AI Coaching:</strong> ${m.ai_coaching_note}</div>`:''}
    </div>`;
  }).join('');
}

// ── Match Trends ──
function renderTrends(){
  const card=$('trendCard');
  if(matchPerformances.length<2){card.style.display='none';return}
  card.style.display='';
  const reversed=[...matchPerformances].reverse();
  const metrics=[
    {key:'engine_rating',label:'Engine & Work Rate'},{key:'defensive_rating',label:'Defensive'},
    {key:'progressive_rating',label:'Progressive'},{key:'aerial_rating',label:'Aerial'},
    {key:'press_resistance_rating',label:'Press Resistance'},{key:'decision_speed_rating',label:'Decision Speed'}
  ];
  const colors=['#6BE3A4','#7DD3FC','#F2C063','#FB923C','#C4B5FD','#FF6B6B'];
  let html='';
  metrics.forEach((m,i)=>{
    const vals=reversed.map(r=>r[m.key]||0);
    html+=`<div class="trend-wrap"><div style="font-size:10px;color:var(--text-tertiary);margin-bottom:2px">${m.label}</div>
      <svg class="trend-svg" viewBox="0 0 280 40" preserveAspectRatio="none">${sparklineSVG(vals,colors[i])}</svg></div>`;
  });
  $('trendCharts').innerHTML=html;

  // Cross-reference analysis
  const avgByMetric={};metrics.forEach(m=>{const vals=reversed.map(r=>r[m.key]||0);avgByMetric[m.key]=vals.reduce((a,b)=>a+b,0)/vals.length});
  const sorted=Object.entries(avgByMetric).sort((a,b)=>a[1]-b[1]);
  const weakest=sorted[0];const strongest=sorted[sorted.length-1];
  const techAvg=reversed.reduce((sum,r)=>{const t=['engine_rating','progressive_rating','press_resistance_rating'];return sum+t.reduce((s,k)=>s+(r[k]||0),0)/t.length},0)/reversed.length;

  if(weakest[0]==='decision_speed_rating'&&techAvg>=7){
    $('crossRef').innerHTML=`<div class="cross-ref">
      🧠 <strong>Low decision speed with good technical quality</strong> indicates a tactical awareness or anticipation gap rather than a technical one. Recommend more tactical study: watch Declan Rice and Rodri press triggers and positioning. Focus on scanning before receiving — the best DMs check their shoulder 3-4 times before the ball arrives.
    </div>`;
  }else{
    $('crossRef').innerHTML='';
  }
}function sparklineSVG(vals,color){
  if(vals.length<2)return'';
  const W=280,H=40,pad=4;const min=Math.min(...vals),max=Math.max(...vals);const range=(max-min)||1;
  const pts=vals.map((v,i)=>({x:pad+(i/(vals.length-1))*(W-pad*2),y:H-pad-((v-min)/range)*(H-pad*2)}));
  const line=pts.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  const area=line+` L${pts[pts.length-1].x},${H} L${pts[0].x},${H} Z`;
  const gradId='sg_'+color.replace('#','');
  return `<defs><linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity=".25"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#${gradId})"/><path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round"/><circle cx="${pts[pts.length-1].x}" cy="${pts[pts.length-1].y}" r="3" fill="${color}"/>`;
}

// ── AI Coaching ──
async function generateAiCoaching(match){
  if(!GEMINI_API_KEY){$('matchAiNote').innerHTML='<div class="ai-note">Set Gemini API key for AI coaching notes</div>';return''}
  try{
    const ratingsText=[
      'Engine & Work Rate: '+match.engine_rating+'/10',
      'Defensive Actions: '+match.defensive_rating+'/10',
      'Progressive Actions: '+match.progressive_rating+'/10',
      'Aerial Duels: '+match.aerial_rating+'/10',
      'Press Resistance: '+match.press_resistance_rating+'/10',
      'Decision Speed: '+match.decision_speed_rating+'/10'
    ].join(', ');
    const techSummary=techSessions.slice(0,10).map(s=>`${s.date}: ${s.session_type} ${s.duration_minutes}min (${s.focus_areas&&typeof s.focus_areas==='object'?s.focus_areas.join(', '):'none'})`).join('; ');
    const prompt=`You are an elite football coach. A D1-level central midfielder played a ${match.competition_type} match. Performance ratings (1-10): ${ratingsText}. Recent technical sessions: ${techSummary}. Match notes from player: "${match.notes||'none'}". Give ONE specific training prescription for this week based on the match performance. Keep it under 80 words. Be direct and actionable.`;
    const res=await fetch(`${GEMINI_URL}?key=${GEMINI_API_KEY}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})});
    if(!res.ok)throw new Error('API '+res.status);
    const data=await res.json();
    return data.candidates?.[0]?.content?.parts?.[0]?.text?.trim()||'';
  }catch(e){console.error('AI coaching error:',e);return''}
}
