<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050506">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dashboard">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>My Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --text-primary: #FAFAFA;
      --text-secondary: #B8B6B0;
      --text-tertiary: #76746E;
      --success: #6BE3A4;
      --warning: #F2C063;
      --danger: #FF6B6B;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    @keyframes bg-drift {
      0%, 100% { background-position: 82% 14%, 18% 90%; }
      50% { background-position: 78% 18%, 22% 86%; }
    }

    @keyframes grain { 0% { transform: translate(0,0); } 100% { transform: translate(3px,3px); } }

    @keyframes led-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }

    @keyframes ticker-sweep {
      0% { left: -40%; }
      100% { left: 110%; }
    }

    @keyframes ticker-leave {
      to { opacity: 0; transform: translateY(-100%); }
    }

    @keyframes ticker-enter {
      from { opacity: 0; transform: translateY(100%); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes gm-queue-flash {
      0%, 100% { background-color: rgba(242,192,99,0.10); transform: scale(1); }
      50% { background-color: rgba(242,192,99,0.32); transform: scale(1.015); }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #050506;
      background-image:
        radial-gradient(ellipse 80% 50% at 82% 14%, rgba(224, 118, 88, 0.16), transparent 70%),
        radial-gradient(ellipse 70% 45% at 18% 90%, rgba(180, 180, 200, 0.06), transparent 70%);
      background-size: 100% 100%;
      background-attachment: fixed;
      animation: bg-drift 36s ease-in-out infinite alternate;
      color: var(--text-primary);
      min-height: 100vh;
      min-height: 100dvh;
      max-width: 1100px;
      margin: 0 auto;
      padding: 12px 20px max(32px, env(safe-area-inset-bottom));
      position: relative;
    }

    body.has-topbar { padding-top: 0; }
    body.has-dash-tabs {
      padding-bottom: calc(88px + env(safe-area-inset-bottom));
    }

    .tab-panels { position: relative; z-index: 2; }
    .tab-panel { display: none; }
    .tab-panel.is-active { display: block; }
    .tab-panel[hidden] { display: none !important; }

    .tab-iframe {
      display: block;
      width: 100%;
      min-height: calc(100dvh - 120px);
      border: 0;
      background: transparent;
    }

    .tabbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 50;
      display: flex;
      justify-content: center;
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(5,5,6,0) 0%, rgba(5,5,6,0.78) 38%, rgba(5,5,6,0.94) 100%);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      pointer-events: none;
    }
    .tabbar-inner {
      pointer-events: auto;
      display: flex;
      width: 100%;
      max-width: min(460px, 100%);
      gap: 6px;
      padding: 6px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 18px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.45);
      backdrop-filter: blur(24px) saturate(1.2);
      -webkit-backdrop-filter: blur(24px) saturate(1.2);
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .tabbar-inner::-webkit-scrollbar { display: none; }
    .tabbar .tab {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 11px 14px;
      border-radius: 13px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--text-secondary);
      text-decoration: none;
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .tabbar .tab:hover { color: var(--text-primary); }
    .tabbar .tab[aria-current="page"] {
      color: var(--text-primary);
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.10);
    }
    .tabbar .tab-icon {
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .tabbar .tab-icon svg { width: 100%; height: 100%; display: block; }

    /* On very small screens, show icons only — horizontal scroll still works */
    @media (max-width: 360px) {
      .tabbar .tab span:not(.tab-icon) { display: none; }
      .tabbar .tab { padding: 13px 10px; }
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        radial-gradient(ellipse 80% 50% at 82% 14%, rgba(224, 118, 88, 0.16), transparent 70%),
        radial-gradient(ellipse 70% 45% at 18% 90%, rgba(180, 180, 200, 0.06), transparent 70%);
      filter: blur(40px);
      animation: bg-drift 36s ease-in-out infinite alternate;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0.014;
      background-image: radial-gradient(circle, #fff 0.5px, transparent 0.5px);
      background-size: 3px 3px;
      animation: grain 8s steps(2) infinite;
    }

    main { position: relative; z-index: 2; }

    .dash-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 14px;
      background: linear-gradient(180deg, #FFFFFF 0%, #C7C4BC 120%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .ticker-row { margin-bottom: 18px; display: flex; flex-direction: column; gap: 4px; }

    .goal-ticker {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 12px;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      background-image:
        linear-gradient(180deg, rgba(0,0,0,0.42) 0%, rgba(0,0,0,0.30) 100%),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 3px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .goal-ticker::after {
      content: '';
      position: absolute;
      top: 0;
      width: 30%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
      animation: ticker-sweep 8s linear infinite;
      pointer-events: none;
    }

    .goal-ticker-led-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #6BE3A4;
      box-shadow: 0 0 8px rgba(107,227,164,0.7);
      animation: led-pulse 1.6s ease-in-out infinite;
    }

    .goal-ticker-label {
      font-family: var(--mono);
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 0.18em;
      color: var(--text-tertiary);
    }

    .goal-ticker-stage {
      flex: 1;
      height: 22px;
      position: relative;
      overflow: hidden;
    }

    .goal-ticker-row {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 22px;
      font-family: var(--mono);
      font-size: 12.5px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
      white-space: nowrap;
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
    }

    .goal-ticker-row.is-leaving { animation: ticker-leave 0.45s cubic-bezier(0.55, 0, 0.55, 1) forwards; }
    .goal-ticker-row.is-entering { animation: ticker-enter 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

    .goal-ticker-status {
      width: 18px;
      flex-shrink: 0;
      text-align: center;
      color: var(--text-tertiary);
    }

    .goal-ticker-status[data-status="done"] { color: #6BE3A4; }
    .goal-ticker-status[data-status="pending"] { color: var(--text-tertiary); }
    .goal-ticker-status[data-status="empty"] { color: var(--text-tertiary); }

    .goal-ticker-text {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .goal-ticker-meta {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
    }

    .day-ring-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 26px;
      margin-bottom: 28px;
    }

    .day-ring-visual {
      width: 168px;
      height: 168px;
      position: relative;
      flex-shrink: 0;
    }

    .day-ring-visual svg { width: 100%; height: 100%; display: block; }

    .day-ring-fill {
      transition: stroke-dashoffset 0.7s cubic-bezier(0.22, 1, 0.36, 1), stroke 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .day-ring-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .day-ring-pct {
      font-size: 40px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .day-ring-phase {
      font-family: var(--mono);
      font-size: 9.5px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-top: 5px;
    }

    .day-ring-clock {
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--text-tertiary);
      margin-top: 4px;
    }

    .day-ring-info {
      max-width: 280px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .day-ring-status { font-size: 14px; font-weight: 700; color: var(--text-primary); }
    .day-ring-remaining { font-family: var(--mono); font-size: 12px; color: var(--text-secondary); }
    .day-ring-hours { font-family: var(--mono); font-size: 11px; color: var(--text-tertiary); }

    .section { margin-top: 8px; }

    .section-title {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .section-title::before {
      content: '';
      width: 18px;
      height: 1px;
      background: var(--text-tertiary);
      opacity: 0.6;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(255,255,255,0.08), transparent);
    }

    .gm-card {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 16px;
      padding: 20px 22px;
      backdrop-filter: blur(24px) saturate(1.2);
      -webkit-backdrop-filter: blur(24px) saturate(1.2);
      box-shadow: 0 12px 40px rgba(0,0,0,0.45);
      margin-bottom: 16px;
    }

    .gm-card.gm-all-done {
      background-image: radial-gradient(ellipse 80% 50% at 50% 0%, rgba(107,227,164,0.12), transparent 70%),
        rgba(255, 255, 255, 0.04);
    }

    .gm-card.gm-all-done .gm-progress-num,
    .gm-card.gm-all-done .gm-progress-label { color: var(--success); }

    .gm-card-header {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 14px;
    }

    .gm-eyebrow {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-bottom: 6px;
    }

    .gm-sub { font-size: 12px; color: var(--text-tertiary); }

    .gm-progress-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .gm-progress-num {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: -0.045em;
      font-variant-numeric: tabular-nums;
    }

    .gm-progress-total {
      font-family: var(--mono);
      font-size: 18px;
      color: var(--text-tertiary);
    }

    .gm-progress-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-left: 4px;
    }

    .gm-streak {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      color: var(--text-tertiary);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      align-self: flex-start;
    }

    .gm-streak.gm-streak-active {
      background: rgba(242,192,99,0.10);
      color: #F2C063;
      border: 1px solid rgba(242,192,99,0.32);
    }

    .gm-streak.gm-streak-active .gm-streak-icon {
      filter: drop-shadow(0 0 6px rgba(242,192,99,0.6));
    }

    .gm-streak-num { font-family: var(--mono); font-weight: 700; font-variant-numeric: tabular-nums; }
    .gm-streak-icon { font-size: 13px; }

    .gm-tomorrow-count {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      font-variant-numeric: tabular-nums;
      color: var(--text-tertiary);
      align-self: flex-start;
    }

    .gm-card-tomorrow .gm-progress-row { display: none; }

    .gm-bar {
      display: flex;
      gap: 4px;
      height: 6px;
      margin-bottom: 16px;
    }

    .gm-bar:empty { display: none; }

    .gm-bar-seg {
      flex: 1;
      border-radius: 3px;
      background: rgba(255,255,255,0.08);
    }

    .gm-bar-seg-done {
      background: #6BE3A4;
      box-shadow: 0 0 6px rgba(107,227,164,0.40);
    }

    .goal-list { list-style: none; }

    .goal-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      margin-bottom: 6px;
      background: rgba(255,255,255,0.035);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.06);
      transition: background 0.15s;
    }

    .goal-row:hover { background: rgba(255,255,255,0.06); }
    .goal-row:hover .goal-drag,
    .goal-row:hover .goal-delete { opacity: 1; }

    .goal-row.is-done {
      opacity: 0.45;
      background: rgba(107,227,164,0.04);
    }

    .goal-row.is-done .goal-text {
      text-decoration: line-through;
      text-decoration-color: rgba(255,255,255,0.4);
    }

    .goal-row.is-queued {
      background: rgba(242,192,99,0.10);
      box-shadow: inset 3px 0 0 0 #F2C063;
    }

    .goal-row.is-queued .goal-text { color: #FFE2A8; }
    .goal-row.is-queue-flashing { animation: gm-queue-flash 0.48s ease; }

    .goal-row.drag-over { border-top: 2px solid var(--warning); }

    .goal-drag {
      width: 14px;
      opacity: 0;
      cursor: grab;
      color: var(--text-tertiary);
      font-size: 12px;
      letter-spacing: -2px;
      user-select: none;
      transition: opacity 0.15s;
    }

    .goal-check {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 1.5px solid rgba(255,255,255,0.18);
      background: rgba(0,0,0,0.2);
      flex-shrink: 0;
      cursor: pointer;
      position: relative;
      appearance: none;
      -webkit-appearance: none;
    }

    .goal-check:checked {
      background: #6BE3A4;
      border-color: #6BE3A4;
      box-shadow: 0 0 12px rgba(107,227,164,0.40);
    }

    .goal-check:checked::after {
      content: '';
      position: absolute;
      left: 6px;
      top: 2px;
      width: 6px;
      height: 11px;
      border: solid #0A0A0B;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg) scale(0);
      animation: check-pop 0.28s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes check-pop { to { transform: rotate(45deg) scale(1); } }

    .goal-text {
      flex: 1;
      font-size: 14px;
      outline: none;
      min-width: 0;
    }

    .goal-text[contenteditable="true"] {
      outline: 1px solid rgba(255,255,255,0.25);
      border-radius: 4px;
      padding: 2px 4px;
    }

    .gm-queue-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      opacity: 0.55;
      color: var(--text-tertiary);
      padding: 4px;
    }

    .gm-queue-btn.is-active {
      color: #F2C063;
      opacity: 1;
      filter: drop-shadow(0 0 4px rgba(242,192,99,0.65));
    }

    .gm-queue-btn:disabled { cursor: not-allowed; opacity: 0.3; }

    .goal-delete {
      background: none;
      border: none;
      color: var(--text-tertiary);
      font-size: 18px;
      cursor: pointer;
      opacity: 0;
      padding: 4px 6px;
      transition: opacity 0.15s, color 0.15s;
    }

    .goal-delete:hover { color: var(--danger); }

    .empty-state {
      font-size: 12px;
      font-style: italic;
      color: var(--text-tertiary);
      padding: 14px 0;
      text-align: center;
    }

    .gm-show-more {
      text-align: center;
      padding: 10px;
      margin-bottom: 8px;
      border: 1px dashed rgba(255,255,255,0.12);
      border-radius: 10px;
      color: var(--text-tertiary);
      font-size: 12px;
      cursor: pointer;
    }

    .gm-show-more:hover { color: var(--text-primary); border-color: rgba(255,255,255,0.2); }

    .gm-push-btn {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px dashed rgba(255,255,255,0.15);
      border-radius: 12px;
      background: transparent;
      color: var(--text-tertiary);
      font-size: 13px;
      cursor: pointer;
    }

    .gm-push-btn:hover { color: var(--text-primary); border-color: rgba(255,255,255,0.3); }

    .goal-input-wrap {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 14px;
      margin-top: 4px;
    }

    .goal-input-wrap input {
      flex: 1;
      min-width: 140px;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      color: var(--text-primary);
      font-size: 14px;
    }

    .goal-input-wrap input:focus {
      outline: none;
      border-color: rgba(255,255,255,0.35);
    }

    .goal-input-wrap input::placeholder { color: var(--text-tertiary); }

    .btn-add {
      padding: 11px 20px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      background: linear-gradient(180deg, #FFFFFF 0%, #E8E5DD 100%);
      color: #0A0A0B;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.8);
      transition: transform 0.15s, filter 0.15s;
    }

    .btn-add:hover { transform: translateY(-1px); filter: brightness(1.05); }

    .btn-polish {
      padding: 11px 20px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      background: rgba(255,255,255,0.04);
      color: var(--text-primary);
      border: 1px solid rgba(255,255,255,0.10);
    }

    .btn-polish:hover { background: rgba(255,255,255,0.08); }

    .polish-status {
      width: 100%;
      font-size: 11px;
      color: var(--text-tertiary);
      margin-top: 8px;
      min-height: 14px;
    }

    .polish-status.is-error { color: var(--danger); }

    .sync-banner {
      font-size: 11px;
      color: var(--text-tertiary);
      text-align: center;
      margin-bottom: 12px;
      font-family: var(--mono);
    }

    .sync-banner.is-error { color: var(--danger); }

    @media (max-width: 480px) {
      .dash-title { font-size: 22px; }
      .goal-ticker { padding: 9px 12px; }
      .goal-ticker-label { font-size: 9px; letter-spacing: 0.14em; }
      .goal-ticker-row { font-size: 12px; }
      .goal-ticker-meta { font-size: 10px; padding: 2px 7px; }
      .day-ring-visual { width: 144px; height: 144px; }

  <script src="tabs.js" defer></script>
  <script src="topbar.js" defer></script>
  <script>
  (function () {
    'use strict';

    const WAKE_HOUR = 8;
    const SLEEP_HOUR = 24;
    const GEMINI_API_KEY = window.ENV_GEMINI_API_KEY || "";
    const SUPABASE_URL = 'https://cskbbioyniryonkukamw.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNza2JiaW95bmlyeW9ua3VrYW13Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5NjE2MTYsImV4cCI6MjA5NDUzNzYxNn0.R3Vx3fA-iAc8LhNL3WPSa9-BxH_087c7VaIbrB3CBJM';
    const APP_KEY = 'dashboard';
    const STREAK_KEY = 'goal_streak_v1';
    const RING_C = 2 * Math.PI * 52;

    const SUN_STOPS = [
      { pct: 0, rgb: [255, 216, 158] },
      { pct: 12.5, rgb: [255, 205, 121] },
      { pct: 25, rgb: [255, 227, 143] },
      { pct: 37.5, rgb: [255, 183, 106] },
      { pct: 50, rgb: [255, 149, 89] },
      { pct: 62.5, rgb: [243, 111, 79] },
      { pct: 75, rgb: [226, 93, 122] },
      { pct: 87.5, rgb: [123, 91, 176] },
      { pct: 100, rgb: [47, 58, 102] },
    ];

    let dashState = {};
    let supa = null;
    let pushTimer = null;
    let suppressSync = false;
    let lastSyncedJson = null;
    let pendingRemote = null;
    let storeReady = false;
    let todayExpanded = false;
    let tomorrowExpanded = false;

    const $ = (id) => document.getElementById(id);

    function goalsKey(dateStr) { return 'goals:' + dateStr; }

    function pad(n) { return String(n).padStart(2, '0'); }

    function getActiveDateString() {
      const d = new Date();
      if (d.getHours() < 6) d.setDate(d.getDate() - 1);
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    }

    function getTomorrowDateString() {
      const d = new Date();
      if (d.getHours() < 6) {
        return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
      }
      d.setDate(d.getDate() + 1);
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    }

    function formatDate(ymd) {
      const [y, m, day] = ymd.split('-').map(Number);
      const d = new Date(y, m - 1, day);
      return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function storeGet(key) {
      return dashState[key] !== undefined ? dashState[key] : null;
    }

    function mirrorKeyToLocalStorage(key, value) {
      if (!key.startsWith('goals:') && key !== STREAK_KEY) return;
      try {
        if (value === undefined) localStorage.removeItem(key);
        else localStorage.setItem(key, JSON.stringify(value));
      } catch (_) {}
    }

    function mirrorDashStateToLocalStorage() {
      Object.keys(dashState).forEach((k) => mirrorKeyToLocalStorage(k, dashState[k]));
    }

    function storeSet(key, value) {
      dashState[key] = value;
      mirrorKeyToLocalStorage(key, value);
      if (key.startsWith('goals:')) {
        window.dispatchEvent(new CustomEvent('goals-changed'));
      }
      schedulePush();
    }

    function storeDelete(key) {
      delete dashState[key];
      mirrorKeyToLocalStorage(key, undefined);
      if (key.startsWith('goals:')) {
        window.dispatchEvent(new CustomEvent('goals-changed'));
      }
      schedulePush();
    }

    function storeListKeys(prefix) {
      return Object.keys(dashState).filter((k) => k.startsWith(prefix));
    }

    function migrateFromLocalStorage() {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (!k) continue;
        if (k.startsWith('goals:') || k === STREAK_KEY) {
          try {
            dashState[k] = JSON.parse(localStorage.getItem(k));
          } catch (_) {}
        }
      }
    }

    function schedulePush() {
      if (suppressSync || !supa) return;
      clearTimeout(pushTimer);
      pushTimer = setTimeout(pushNow, 250);
    }

    async function pushNow() {
      if (!supa) return;
      const json = JSON.stringify(dashState);
      if (json === lastSyncedJson) return;
      const { error } = await supa.from('app_state').upsert(
        { key: APP_KEY, data: dashState, updated_at: new Date().toISOString() },
        { onConflict: 'key' }
      );
      if (!error) lastSyncedJson = json;
    }

    function flushPushOnUnload() {
      if (!supa) return;
      const json = JSON.stringify(dashState);
      if (json === lastSyncedJson) return;
      try {
        fetch(SUPABASE_URL + '/rest/v1/app_state?on_conflict=key', {
          method: 'POST',
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: 'Bearer ' + SUPABASE_KEY,
            'Content-Type': 'application/json',
            Prefer: 'resolution=merge-duplicates',
          },
          body: JSON.stringify({ key: APP_KEY, data: dashState, updated_at: new Date().toISOString() }),
          keepalive: true,
        }).catch(() => {});
        lastSyncedJson = json;
      } catch (_) {}
    }

    function isUserEditing() {
      const ae = document.activeElement;
      if (!ae) return false;
      const tag = ae.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return true;
      if (ae.getAttribute && ae.getAttribute('contenteditable') === 'true') return true;
      return false;
    }

    function applyRemoteState(remote) {
      if (!remote || typeof remote !== 'object') return false;
      suppressSync = true;
      let changed = false;
      try {
        const keys = new Set([...Object.keys(dashState), ...Object.keys(remote)]);
        keys.forEach((k) => {
          if (!k.startsWith('goals:') && k !== STREAK_KEY) return;
          const incoming = remote[k];
          const had = dashState[k];
          if (incoming === undefined) {
            if (had !== undefined) { delete dashState[k]; changed = true; }
          } else if (JSON.stringify(had) !== JSON.stringify(incoming)) {
            dashState[k] = incoming;
            changed = true;
          }
        });
      } finally {
        suppressSync = false;
      }
      if (changed) {
        mirrorDashStateToLocalStorage();
        refreshAll();
        window.dispatchEvent(new CustomEvent('dashboard-synced'));
      }
      return changed;
    }

    function maybeApplyRemote(remote) {
      if (isUserEditing()) {
        pendingRemote = remote;
        return;
      }
      applyRemoteState(remote);
    }

    function applyPendingIfReady() {
      if (pendingRemote && !isUserEditing()) {
        const r = pendingRemote;
        pendingRemote = null;
        applyRemoteState(r);
      }
    }

    async function initStore() {
      const banner = $('syncBanner');
      if (!window.supabase) {
        banner.textContent = 'Supabase client failed to load';
        banner.classList.add('is-error');
        migrateFromLocalStorage();
        storeReady = true;
        return;
      }
      supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      try {
        const { data, error } = await supa.from('app_state').select('data').eq('key', APP_KEY).maybeSingle();
        if (error) throw error;
        if (data && data.data && Object.keys(data.data).length > 0) {
          dashState = data.data;
          lastSyncedJson = JSON.stringify(dashState);
          banner.textContent = 'Synced with cloud';
        } else {
          migrateFromLocalStorage();
          if (Object.keys(dashState).length > 0) await pushNow();
          banner.textContent = Object.keys(dashState).length ? 'Local data uploaded to cloud' : 'Ready';
        }
        supa.channel('app_state_' + APP_KEY)
          .on('postgres_changes', {
            event: '*',
            schema: 'public',
            table: 'app_state',
            filter: 'key=eq.' + APP_KEY,
          }, (payload) => {
            if (!payload.new || !payload.new.data) return;
            const incoming = JSON.stringify(payload.new.data);
            if (incoming === lastSyncedJson) return;
            lastSyncedJson = incoming;
            maybeApplyRemote(payload.new.data);
          })
          .subscribe();
        mirrorDashStateToLocalStorage();
        window.dispatchEvent(new CustomEvent('dashboard-synced'));
        storeReady = true;
      } catch (e) {
        const msg = (e && e.message) ? String(e.message) : '';
        if (msg.indexOf('app_state') !== -1 || msg.indexOf('PGRST205') !== -1) {
          banner.textContent = 'Cloud sync needs setup — run SQL block.txt in Supabase SQL Editor';
        } else {
          banner.textContent = 'Cloud sync offline — using local copy';
        }
        banner.classList.add('is-error');
        migrateFromLocalStorage();
        mirrorDashStateToLocalStorage();
        storeReady = true;
      }
    }

    function getTodayGoals() {
      const key = goalsKey(getActiveDateString());
      return storeGet(key) || [];
    }

    function getTomorrowGoals() {
      const key = goalsKey(getTomorrowDateString());
      return storeGet(key) || [];
    }

    function saveTodayGoals(goals) {
      storeSet(goalsKey(getActiveDateString()), goals);
    }

    function saveTomorrowGoals(goals) {
      storeSet(goalsKey(getTomorrowDateString()), goals);
    }

    function runRollover() {
      const active = getActiveDateString();
      const todayKey = goalsKey(active);
      let today = storeGet(todayKey) || [];
      storeListKeys('goals:').forEach((key) => {
        const date = key.slice(6);
        if (date >= active) return;
        const old = storeGet(key) || [];
        old.forEach((g) => {
          if (!g.done && !today.some((t) => t.text === g.text)) {
            today.push({ text: g.text, done: false, queued: g.queued || false });
          }
        });
        storeDelete(key);
      });
      if (today.length) storeSet(todayKey, today);
    }

    function runStreakCheck() {
      const today = new Date();
      const todayStr = today.getFullYear() + '-' + pad(today.getMonth() + 1) + '-' + pad(today.getDate());
      let streak = storeGet(STREAK_KEY) || { count: 0, lastProcessedDate: null };
      const keys = storeListKeys('goals:')
        .map((k) => k.slice(6))
        .filter((d) => d < todayStr)
        .sort();
      let startIdx = 0;
      if (streak.lastProcessedDate) {
        const idx = keys.indexOf(streak.lastProcessedDate);
        startIdx = idx >= 0 ? idx + 1 : 0;
      }
      for (let i = startIdx; i < keys.length; i++) {
        const goals = storeGet('goals:' + keys[i]) || [];
        if (goals.length === 0) continue;
        if (goals.every((g) => g.done)) streak.count += 1;
        else streak.count = 0;
        streak.lastProcessedDate = keys[i];
      }
      storeSet(STREAK_KEY, streak);
    }

    function formatHm(hours) {
      const h = Math.floor(hours);
      const m = Math.round((hours - h) * 60);
      return h + 'h ' + m + 'm';
    }

    function lerpColor(pct) {
      let a = SUN_STOPS[0];
      let b = SUN_STOPS[SUN_STOPS.length - 1];
      for (let i = 0; i < SUN_STOPS.length - 1; i++) {
        if (pct >= SUN_STOPS[i].pct && pct <= SUN_STOPS[i + 1].pct) {
          a = SUN_STOPS[i];
          b = SUN_STOPS[i + 1];
          break;
        }
      }
      const range = b.pct - a.pct || 1;
      const t = (pct - a.pct) / range;
      const rgb = a.rgb.map((v, i) => Math.round(v + (b.rgb[i] - v) * t));
      return 'rgb(' + rgb.join(',') + ')';
    }

    function updateDayBar() {
      const now = new Date();
      const hours = now.getHours() + now.getMinutes() / 60 + now.getSeconds() / 3600;
      const fill = $('dayRingFill');
      fill.style.strokeDasharray = String(RING_C);

      const clockStr = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
      $('dayRingClock').textContent = clockStr;

      if (hours < WAKE_HOUR) {
        fill.style.strokeDashoffset = String(RING_C);
        fill.style.stroke = '#4D4B47';
        $('dayRingPct').textContent = '—';
        $('dayRingPhase').textContent = 'SLEEPING';
        $('dayRingStatus').textContent = '😴 Still sleeping';
        $('dayRingRemaining').textContent = formatHm(WAKE_HOUR - hours) + ' until wake-up';
        return;
      }

      if (hours >= SLEEP_HOUR) {
        fill.style.strokeDashoffset = '0';
        fill.style.stroke = '#E25D7A';
        $('dayRingPct').textContent = '100%';
        $('dayRingPhase').textContent = 'PAST BEDTIME';
        $('dayRingStatus').textContent = '⚠️ Past bedtime';
        $('dayRingRemaining').textContent = 'Sleep!';
        return;
      }

      const percent = ((hours - WAKE_HOUR) / (SLEEP_HOUR - WAKE_HOUR)) * 100;
      fill.style.strokeDashoffset = String(RING_C * (1 - percent / 100));
      fill.style.stroke = lerpColor(percent);
      $('dayRingPct').textContent = Math.round(percent) + '%';

      let phase, status;
      if (percent < 25) { phase = 'MORNING'; status = '☀️ Morning — fresh start'; }
      else if (percent < 50) { phase = 'MIDDAY'; status = '⚡ Midday — keep moving'; }
      else if (percent < 75) { phase = 'AFTERNOON'; status = '🔥 Afternoon — push it'; }
      else if (percent < 90) { phase = 'EVENING'; status = '⏳ Evening — wrap up'; }
      else { phase = 'BEDTIME'; status = '🌙 Bedtime soon'; }

      $('dayRingPhase').textContent = phase;
      $('dayRingStatus').textContent = status;
      $('dayRingRemaining').textContent = formatHm(SLEEP_HOUR - hours) + ' awake time left';
    }

    /* Goal Ticker */
    let tickerItems = [];
    let cycleIdx = 0;
    let tickerFirst = true;
    let tickerTimer = null;

    function statusGlyph(status) {
      if (status === 'done') return '✓';
      if (status === 'pending') return '○';
      return '·';
    }

    function buildTickerItems() {
      const goals = getTodayGoals();
      const total = goals.length;
      const done = goals.filter((g) => g.done).length;
      $('goalTickerMeta').textContent = done + '/' + total;

      if (total === 0) {
        return [{ status: 'empty', text: 'No goals set for today — add one to get rolling.' }];
      }
      if (done === total) {
        return [{ status: 'done', text: '✓ All goals done — solid day.' }];
      }
      return goals.filter((g) => !g.done).map((g) => ({ status: 'pending', text: g.text }));
    }

    function tickerSwap(item) {
      const stage = $('goalTickerStage');
      const existing = stage.querySelector('.goal-ticker-row');

      const makeRow = (it, animClass) => {
        const row = document.createElement('div');
        row.className = 'goal-ticker-row' + (animClass ? ' ' + animClass : '');
        const st = document.createElement('span');
        st.className = 'goal-ticker-status';
        st.setAttribute('data-status', it.status);
        st.textContent = statusGlyph(it.status);
        const tx = document.createElement('span');
        tx.className = 'goal-ticker-text';
        tx.textContent = it.text;
        row.appendChild(st);
        row.appendChild(tx);
        return row;
      };

      if (tickerFirst) {
        tickerFirst = false;
        stage.innerHTML = '';
        stage.appendChild(makeRow(item, ''));
        return;
      }

      if (existing) {
        existing.classList.add('is-leaving');
        setTimeout(() => existing.remove(), 460);
      }
      stage.appendChild(makeRow(item, 'is-entering'));
    }

    function tickerTick() {
      tickerItems = buildTickerItems();
      if (!tickerItems.length) tickerItems = [{ status: 'empty', text: '—' }];
      const item = tickerItems[cycleIdx % tickerItems.length];
      tickerSwap(item);
      cycleIdx = (cycleIdx + 1) % tickerItems.length;
    }

    function tickerStart() {
      tickerTick();
      if (tickerTimer) clearInterval(tickerTimer);
      tickerTimer = setInterval(tickerTick, 5000);
    }

    window.addEventListener('goals-changed', () => {
      cycleIdx = 0;
      tickerFirst = true;
      tickerTick();
    });

    function renderTodayHeader() {
      const goals = getTodayGoals();
      const done = goals.filter((g) => g.done).length;
      const total = goals.length;
      $('gmProgressNum').textContent = String(done);
      $('gmProgressTotal').textContent = '/ ' + total;
      const label = $('gmProgressLabel');
      if (total === 0) label.textContent = 'no goals yet';
      else if (done === total) label.textContent = 'all done — solid day';
      else label.textContent = 'complete';

      const bar = $('gmBar');
      bar.innerHTML = '';
      goals.forEach((g) => {
        const seg = document.createElement('div');
        seg.className = 'gm-bar-seg' + (g.done ? ' gm-bar-seg-done' : '');
        bar.appendChild(seg);
      });

      $('todayCard').classList.toggle('gm-all-done', total > 0 && done === total);
      $('gmPushBtn').hidden = !goals.some((g) => !g.done);
    }

    function renderStreak() {
      const streak = storeGet(STREAK_KEY) || { count: 0 };
      $('gmStreakNum').textContent = String(streak.count || 0);
      $('gmStreak').classList.toggle('gm-streak-active', (streak.count || 0) > 0);
    }

    function renderTomorrowCount() {
      const n = getTomorrowGoals().length;
      $('gmTomorrowCount').textContent = n + ' planned';
    }

    function makeInlineEdit(el, onCommit) {
      el.addEventListener('click', () => {
        if (el.getAttribute('contenteditable') === 'true') return;
        el.setAttribute('contenteditable', 'true');
        el.focus();
        const range = document.createRange();
        range.selectNodeContents(el);
        range.collapse(false);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      });
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
        if (e.key === 'Escape') {
          e.preventDefault();
          el.removeAttribute('contenteditable');
          onCommit(null, true);
        }
      });
      el.addEventListener('blur', () => {
        if (el.getAttribute('contenteditable') !== 'true') return;
        const text = el.textContent.trim();
        el.removeAttribute('contenteditable');
        onCommit(text, false);
      });
    }

    function wireDragReorder(row, listKey, getGoals, saveGoals, reload) {
      row.draggable = true;
      row.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/plain', String(row.dataset.idx));
        row.classList.add('dragging');
      });
      row.addEventListener('dragend', () => row.classList.remove('dragging'));
      row.addEventListener('dragover', (e) => {
        e.preventDefault();
        row.classList.add('drag-over');
      });
      row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
      row.addEventListener('drop', (e) => {
        e.preventDefault();
        row.classList.remove('drag-over');
        const from = parseInt(e.dataTransfer.getData('text/plain'), 10);
        const to = parseInt(row.dataset.idx, 10);
        if (from === to || Number.isNaN(from) || Number.isNaN(to)) return;
        const goals = getGoals();
        const [moved] = goals.splice(from, 1);
        goals.splice(to, 0, moved);
        saveGoals(goals);
        reload();
      });
    }

    function buildGoalRow(g, idx, listKey, getGoals, saveGoals, reload, readOnly) {
      const li = document.createElement('li');
      li.className = 'goal-row' + (g.done ? ' is-done' : '') + (g.queued ? ' is-queued' : '');
      li.dataset.idx = String(idx);

      const drag = document.createElement('span');
      drag.className = 'goal-drag';
      drag.textContent = '⋮⋮';

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.className = 'goal-check';
      cb.checked = !!g.done;
      if (readOnly) {
        cb.disabled = true;
        cb.title = 'Activates at 6 AM tomorrow';
      } else {
        cb.addEventListener('change', () => {
          const goals = getGoals();
          goals[idx].done = cb.checked;
          if (cb.checked) goals[idx].doneAt = Date.now();
          else delete goals[idx].doneAt;
          saveGoals(goals);
          reload();
        });
      }

      const text = document.createElement('span');
      text.className = 'goal-text';
      text.textContent = g.text;
      makeInlineEdit(text, (newText, cancelled) => {
        if (cancelled) { reload(); return; }
        if (!newText) { reload(); return; }
        const goals = getGoals();
        if (newText !== goals[idx].text) {
          goals[idx].text = newText;
          saveGoals(goals);
        }
        reload();
      });

      const queueBtn = document.createElement('button');
      queueBtn.type = 'button';
      queueBtn.className = 'gm-queue-btn' + (g.queued ? ' is-active' : '');
      queueBtn.textContent = '⚡';
      queueBtn.title = 'Queue for productivity window';
      if (readOnly) {
        queueBtn.disabled = true;
      } else {
        queueBtn.addEventListener('click', () => {
          const goals = getGoals();
          goals[idx].queued = !goals[idx].queued;
          saveGoals(goals);
          li.classList.add('is-queue-flashing');
          setTimeout(reload, 480);
        });
      }

      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'goal-delete';
      del.textContent = '×';
      del.addEventListener('click', () => {
        const goals = getGoals();
        goals.splice(idx, 1);
        saveGoals(goals);
        reload();
      });

      li.appendChild(drag);
      li.appendChild(cb);
      li.appendChild(text);
      li.appendChild(queueBtn);
      li.appendChild(del);
      wireDragReorder(li, listKey, getGoals, saveGoals, reload);
      return li;
    }

    function renderListInto(goals, listEl, emptyEl, getGoals, saveGoals, reload, readOnly, expandedFlag) {
      listEl.innerHTML = '';
      emptyEl.style.display = goals.length ? 'none' : 'block';

      const head = goals.length > 5 ? goals.slice(0, 5) : goals;
      head.forEach((g, i) => {
        listEl.appendChild(buildGoalRow(g, i, '', getGoals, saveGoals, reload, readOnly));
      });

      if (goals.length > 5) {
        const toggle = document.createElement('li');
        toggle.className = 'gm-show-more';
        toggle.textContent = expandedFlag
          ? 'Show less ▴'
          : 'Show ' + (goals.length - 5) + ' more ▾';
        toggle.addEventListener('click', () => {
          if (readOnly) tomorrowExpanded = !tomorrowExpanded;
          else todayExpanded = !todayExpanded;
          reload();
        });
        listEl.appendChild(toggle);
        if (expandedFlag) {
          goals.slice(5).forEach((g, j) => {
            listEl.appendChild(buildGoalRow(g, j + 5, '', getGoals, saveGoals, reload, readOnly));
          });
        }
      }
    }

    function loadToday() {
      const active = getActiveDateString();
      $('todayLabel').textContent = 'Today — ' + formatDate(active);
      const goals = getTodayGoals();
      renderListInto(
        goals,
        $('goalList'),
        $('emptyState'),
        getTodayGoals,
        saveTodayGoals,
        loadToday,
        false,
        todayExpanded
      );
      renderTodayHeader();
    }

    function loadTomorrow() {
      const tm = getTomorrowDateString();
      $('tomorrowLabel').textContent = 'Plan tomorrow — ' + formatDate(tm);
      const goals = getTomorrowGoals();
      renderListInto(
        goals,
        $('tomorrowList'),
        $('tomorrowEmpty'),
        getTomorrowGoals,
        saveTomorrowGoals,
        loadTomorrow,
        true,
        tomorrowExpanded
      );
      renderTomorrowCount();
    }

    function refreshAll() {
      loadToday();
      loadTomorrow();
      renderStreak();
      cycleIdx = 0;
      tickerFirst = true;
      tickerTick();
    }

    function showStatus(el, msg, isError) {
      el.textContent = msg;
      el.classList.toggle('is-error', !!isError);
      setTimeout(() => {
        el.textContent = '';
        el.classList.remove('is-error');
      }, 3500);
    }

    async function polishGoal(raw, statusEl, getGoals, saveGoals, reload) {
      const text = raw.trim();
      if (!text) return;
      if (!true) {
        const goals = getGoals();
        goals.push({ text, done: false });
        saveGoals(goals);
        showStatus(statusEl, 'Polish needs a Gemini API key — added as-typed.');
        reload();
        return;
      }
      try {
        const prompt = 'Clean up exactly ONE todo goal. Return ONLY a valid JSON array with exactly one string element — the polished goal. No markdown fences, no explanation. Input: "' + text.replace(/"/g, '\\"') + '"';
        const res = await fetch(GEMINI_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
          }),
        });
        if (!res.ok) throw new Error('API ' + res.status);
        const data = await res.json();
        let out = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
        out = out.trim().replace(/^```json?\s*/i, '').replace(/```\s*$/i, '').trim();
        let parsed;
        try { parsed = JSON.parse(out); } catch (_) {
          const m = out.match(/\[[\s\S]*\]/);
          if (m) parsed = JSON.parse(m[0]);
        }
        const polished = Array.isArray(parsed) && parsed[0] ? String(parsed[0]).trim() : text;
        const goals = getGoals();
        goals.push({ text: polished, done: false });
        saveGoals(goals);
        reload();
      } catch (_) {
        const goals = getGoals();
        goals.push({ text, done: false });
        saveGoals(goals);
        showStatus(statusEl, 'Polish failed — added as-typed.', true);
        reload();
      }
    }

    function makeAddHandlers(input, addBtn, polishBtn, getGoals, saveGoals, reload, statusEl) {
      addBtn.addEventListener('click', () => {
        const t = input.value.trim();
        if (!t) return;
        const goals = getGoals();
        goals.push({ text: t, done: false });
        saveGoals(goals);
        input.value = '';
        reload();
      });
      polishBtn.addEventListener('click', async () => {
        const t = input.value.trim();
        if (!t) return;
        polishBtn.disabled = true;
        await polishGoal(t, statusEl, getGoals, saveGoals, () => { input.value = ''; reload(); });
        polishBtn.disabled = false;
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') addBtn.click();
      });
    }

  $('gmPushBtn').addEventListener('click', () => {
      const today = getTodayGoals();
      const unchecked = today.filter((g) => !g.done);
      if (!unchecked.length) return;
      if (!confirm('Move ' + unchecked.length + ' unchecked goal(s) to tomorrow?')) return;
      let tomorrow = getTomorrowGoals();
      unchecked.forEach((g) => {
        if (!tomorrow.some((t) => t.text === g.text)) {
          tomorrow.push({ text: g.text, done: false, queued: g.queued || false });
        }
      });
      saveTomorrowGoals(tomorrow);
      saveTodayGoals(today.filter((g) => g.done));
      loadToday();
      loadTomorrow();
    });

    async function boot() {
      await initStore();
      runRollover();
      runStreakCheck();

      $('todayLabel').textContent = 'Today — ' + formatDate(getActiveDateString());
      $('tomorrowLabel').textContent = 'Plan tomorrow — ' + formatDate(getTomorrowDateString());

      makeAddHandlers($('goalInput'), $('goalAddBtn'), $('goalPolishBtn'), getTodayGoals, saveTodayGoals, loadToday, $('polishStatus'));
      makeAddHandlers($('tomorrowInput'), $('tomorrowAddBtn'), $('tomorrowPolishBtn'), getTomorrowGoals, saveTomorrowGoals, loadTomorrow, $('tomorrowStatus'));

      loadToday();
      loadTomorrow();
      renderStreak();
      updateDayBar();
      setInterval(updateDayBar, 60000);
      tickerStart();

      document.addEventListener('focusout', () => setTimeout(applyPendingIfReady, 0), true);
      window.addEventListener('pagehide', flushPushOnUnload);
      window.addEventListener('beforeunload', flushPushOnUnload);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') flushPushOnUnload();
      });

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }
    }

    boot();
  })();
  </script>
</body>
