<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050506">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dashboard">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>My Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --text-primary: #FAFAFA;
      --text-secondary: #B8B6B0;
      --text-tertiary: #76746E;
      --success: #6BE3A4;
      --warning: #F2C063;
      --danger: #FF6B6B;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    @keyframes bg-drift {
      0%, 100% { background-position: 82% 14%, 18% 90%; }
      50% { background-position: 78% 18%, 22% 86%; }
    }

    @keyframes grain { 0% { transform: translate(0,0); } 100% { transform: translate(3px,3px); } }

    @keyframes led-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }

    @keyframes ticker-sweep {
      0% { left: -40%; }
      100% { left: 110%; }
    }

    @keyframes ticker-leave {
      to { opacity: 0; transform: translateY(-100%); }
    }

    @keyframes ticker-enter {
      from { opacity: 0; transform: translateY(100%); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes gm-queue-flash {
      0%, 100% { background-color: rgba(242,192,99,0.10); transform: scale(1); }
      50% { background-color: rgba(242,192,99,0.32); transform: scale(1.015); }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #050506;
      background-image:
        radial-gradient(ellipse 80% 50% at 82% 14%, rgba(224, 118, 88, 0.16), transparent 70%),
        radial-gradient(ellipse 70% 45% at 18% 90%, rgba(180, 180, 200, 0.06), transparent 70%);
      background-size: 100% 100%;
      background-attachment: fixed;
      animation: bg-drift 36s ease-in-out infinite alternate;
      color: var(--text-primary);
      min-height: 100vh;
      min-height: 100dvh;
      max-width: 1100px;
      margin: 0 auto;
      padding: 12px 20px max(32px, env(safe-area-inset-bottom));
      position: relative;
    }

    body.has-topbar { padding-top: 0; }
    body.has-dash-tabs {
      padding-bottom: calc(88px + env(safe-area-inset-bottom));
    }

    .tab-panels { position: relative; z-index: 2; }
    .tab-panel { display: none; }
    .tab-panel.is-active { display: block; }
    .tab-panel[hidden] { display: none !important; }

    .tab-iframe {
      display: block;
      width: 100%;
      min-height: calc(100dvh - 120px);
      border: 0;
      background: transparent;
    }

    .tabbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 50;
      display: flex;
      justify-content: center;
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(5,5,6,0) 0%, rgba(5,5,6,0.78) 38%, rgba(5,5,6,0.94) 100%);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      pointer-events: none;
    }
    .tabbar-inner {
      pointer-events: auto;
      display: flex;
      width: 100%;
      max-width: min(460px, 100%);
      gap: 6px;
      padding: 6px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 18px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.45);
      backdrop-filter: blur(24px) saturate(1.2);
      -webkit-backdrop-filter: blur(24px) saturate(1.2);
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .tabbar-inner::-webkit-scrollbar { display: none; }
    .tabbar .tab {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 11px 14px;
      border-radius: 13px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--text-secondary);
      text-decoration: none;
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .tabbar .tab:hover { color: var(--text-primary); }
    .tabbar .tab[aria-current="page"] {
      color: var(--text-primary);
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.10);
    }
    .tabbar .tab-icon {
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .tabbar .tab-icon svg { width: 100%; height: 100%; display: block; }

    /* On very small screens, show icons only — horizontal scroll still works */
    @media (max-width: 360px) {
      .tabbar .tab span:not(.tab-icon) { display: none; }
      .tabbar .tab { padding: 13px 10px; }
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        radial-gradient(ellipse 80% 50% at 82% 14%, rgba(224, 118, 88, 0.16), transparent 70%),
        radial-gradient(ellipse 70% 45% at 18% 90%, rgba(180, 180, 200, 0.06), transparent 70%);
      filter: blur(40px);
      animation: bg-drift 36s ease-in-out infinite alternate;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0.014;
      background-image: radial-gradient(circle, #fff 0.5px, transparent 0.5px);
      background-size: 3px 3px;
      animation: grain 8s steps(2) infinite;
    }

    main { position: relative; z-index: 2; }

  </style>
</head>
