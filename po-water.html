<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<meta name="color-scheme" content="dark">
<title>Water Tracking — Moved</title>
<style>
:root {
  --bg: #050506;
  --text-1: #FAFAFA;
  --text-2: #B8B6B0;
  --text-3: #76746E;
  --font: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text-1);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
}
.redirect-card {
  text-align: center;
  padding: 40px 24px;
  max-width: 420px;
}
.redirect-icon { font-size: 48px; margin-bottom: 16px; }
.redirect-title { font-size: 20px; font-weight: 700; margin: 0 0 8px; letter-spacing: -0.015em; }
.redirect-msg { font-size: 14px; color: var(--text-3); margin: 0 0 24px; line-height: 1.5; }
.redirect-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 24px;
  background: linear-gradient(180deg, #ffffff 0%, #e8e5dd 100%);
  color: #0a0a0b;
  border: none; border-radius: 12px;
  font-family: inherit; font-size: 15px; font-weight: 700;
  text-decoration: none; cursor: pointer;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.55), 0 4px 14px rgba(0,0,0,0.40);
  transition: transform 0.12s;
}
.redirect-btn:hover { transform: translateY(-1px); }
</style>
</head>
<body>
<div class="redirect-card">
  <div class="redirect-icon">💧</div>
  <h1 class="redirect-title">Water tracking has moved</h1>
  <p class="redirect-msg">Water tracking is now part of the Health tab, alongside your daily supplement stack. All your data and settings are preserved.</p>
  <a href="stack.html" class="redirect-btn">Open Health tab →</a>
</div>
</body>
</html>
